name: Daily tender update

# GitHub's clock is UTC. These two times cover 12:00 in Wales all year:
# 11:00 UTC is 12:00 in summer (BST) and 12:00 UTC is 12:00 in winter (GMT).
# The "Check the time" step lets only the run that lands at 12:00 UK time go ahead.
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days (leave blank for since the last run)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tender-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the time
        id: gate
        run: |
          HOUR=$(TZ=Europe/London date +%H)
          echo "UK time is $(TZ=Europe/London date '+%H:%M')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "13" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 12:00 in the UK yet, skipping this run."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Fetch new tenders
        if: steps.gate.outputs.go == 'true'
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="--force"; fi
          if [ -n "${{ github.event.inputs.days }}" ]; then ARGS="$ARGS --days ${{ github.event.inputs.days }}"; fi
          python scripts/update.py $ARGS

      - name: Save the new data
        id: commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "tender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily tender update $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
