<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live and upcoming public-sector tenders across Wales, by council, sector, buyer and industry code. Updated daily.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%226%22 width=%2220%22 height=%2220%22 transform=%22rotate(45 16 16)%22 fill=%22%23c8102e%22/%3E%3C/svg%3E">
<title>Wales Tender Pipeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: header + tabs + KPI band, then a two-column workspace. Left (sticky): council map, deadline strip or award summary, bid-readiness. Right: filters, saved searches, results. Stacks on phones. */
:root{
  --bg:#f6f6f6; --surface:#ffffff; --sunk:#f0f0f0; --ink:#111111; --muted:#5e5e5e; --line:#dcdcdc;
  --accent:#c8102e; --accent-ink:#ffffff; --urgent:#c8102e; --warn:#b45309; --good:#00843d;
  --band:#111111; --band-ink:#ffffff; --band-muted:#c4c4c4; --band-line:#3a3a3a; --band-accent:#ff5c6c;
  --field:#8c8c8c;
  --st-active:#c8102e; --st-pme:#b45309; --st-planned:#00733a; --st-pipeline:#6b6b6b; --st-dps:#111111;
  --s-construction:#c2410c; --s-health:#be185d; --s-energy:#0f766e; --s-transport:#1d4ed8;
  --s-education:#7c3aed; --s-research:#a16207; --s-professional:#475569; --s-supplies:#8b5e34; --s-environment:#4d7c0f;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --surface:#161616; --sunk:#1f1f1f; --ink:#f2f2f2; --muted:#a3a3a3; --line:#2e2e2e;
  --accent:#ff4d5e; --accent-ink:#0c0c0c; --urgent:#ff4d5e; --warn:#f5a524; --good:#3ccf7e;
  --band:#000000; --band-ink:#ffffff; --band-muted:#bdbdbd; --band-line:#333333; --band-accent:#ff5c6c;
  --field:#6b6b6b;
  --st-active:#ff4d5e; --st-pme:#f5a524; --st-planned:#3ccf7e; --st-pipeline:#a3a3a3; --st-dps:#e8e8e8;
  --s-construction:#f08a4b; --s-health:#f472b6; --s-energy:#2dd4bf; --s-transport:#7aa2ff;
  --s-education:#b79cff; --s-research:#e0b04a; --s-professional:#a3b1c2; --s-supplies:#d0a175; --s-environment:#9ccc4a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#161616; --sunk:#1f1f1f; --ink:#f2f2f2; --muted:#a3a3a3; --line:#2e2e2e;
  --accent:#ff4d5e; --accent-ink:#0c0c0c; --urgent:#ff4d5e; --warn:#f5a524; --good:#3ccf7e;
  --band:#000000; --band-ink:#ffffff; --band-muted:#bdbdbd; --band-line:#333333; --band-accent:#ff5c6c;
  --field:#6b6b6b;
  --st-active:#ff4d5e; --st-pme:#f5a524; --st-planned:#3ccf7e; --st-pipeline:#a3a3a3; --st-dps:#e8e8e8;
  --s-construction:#f08a4b; --s-health:#f472b6; --s-energy:#2dd4bf; --s-transport:#7aa2ff;
  --s-education:#b79cff; --s-research:#e0b04a; --s-professional:#a3b1c2; --s-supplies:#d0a175; --s-environment:#9ccc4a;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;background:var(--band);color:var(--band-ink);box-shadow:0 0 0 100vmax var(--band);clip-path:inset(0 -100vmax);margin-top:-20px;padding-block:26px 24px;position:relative}
header::after{content:"";position:absolute;left:-100vmax;right:-100vmax;bottom:0;height:6px;background:var(--accent)}
.htext{display:grid;gap:6px;min-width:0;flex:1 1 520px}
.hside{display:grid;gap:8px;justify-items:end}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-accent)}
h1{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:clamp(28px,4.4vw,46px);line-height:1.02;margin:0;text-wrap:balance}
h1 .alt{display:block;font-weight:500;font-stretch:90%;color:var(--band-muted);font-size:.5em;margin-top:6px}
.lede{color:var(--band-muted);max-width:68ch;margin:4px 0 6px}
.hrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.bidready{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.bidready:hover{background:transparent;color:var(--band-ink)}
.bidready:focus-visible,.lang button:focus-visible{outline:2px solid var(--band-ink);outline-offset:2px}
dialog.sheet{width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px 22px 18px}
dialog.sheet::backdrop{background:rgba(0,0,0,.6)}
dialog.sheet h2{font-family:var(--f-display);font-stretch:112%;font-size:24px;margin:0 70px 6px 0}
dialog.sheet .ready{margin-top:12px}
.lang{display:inline-flex;border:1px solid var(--band-line);border-radius:999px;overflow:hidden;background:transparent}
.lang button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--band-muted);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.badge{font-family:var(--f-mono);font-size:11px;color:var(--band-muted);border:1px dashed var(--band-line);border-radius:4px;padding:2px 7px}
.badge.live{color:#7be3a6;border-style:solid;border-color:currentColor}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;font-weight:650;border:0;background:none;color:var(--muted);padding:10px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.tabs .n{font-family:var(--f-mono);font-size:12px;font-weight:400;margin-left:6px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-self:center;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-stretch:110%;font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.03em}
.kpi.urgent b{color:var(--urgent)}
.overview{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:stretch}
.overview>.panel{align-content:start}
.mapwrap{position:relative;aspect-ratio:var(--ar);width:min(100%,calc(min(52vh,560px) * var(--ar)));margin:0 auto;max-width:100%}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;max-height:none}
.mapov{position:absolute;inset:0;pointer-events:none}
.mapov .lbl{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:24px;padding:0 6px;border-radius:12px;background:var(--surface);color:var(--ink);border:1px solid var(--ink);font:600 12px/22px var(--f-mono);text-align:center;font-variant-numeric:tabular-nums}
.mapov .lbl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mapov .nm{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 6px var(--surface)}
@media (max-width:640px){.mapov .nm{display:none}}
.results-col{display:grid;gap:14px}
.col{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:13px;font-family:var(--f-mono);font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h2 .aside,.panel h2 button{font:inherit;font-size:11px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-transform:none;letter-spacing:0}
.panel h2 .aside{color:var(--muted);cursor:default}
.tilenote{font-size:12px;color:var(--muted)}
/* map */
.mapbox svg{width:100%;height:auto;display:block;max-height:min(46vh,520px)}
.mapbox path{fill:var(--accent);stroke:var(--surface);stroke-width:.9;stroke-linejoin:round;cursor:pointer;transition:fill-opacity .15s}
.mapbox path.zero{fill:var(--sunk);fill-opacity:1}
.mapbox path:hover{stroke:var(--ink);stroke-width:1.4}
.mapbox path.on,.mapbox path:focus-visible{outline:none;stroke:var(--ink);stroke-width:2.4}
.mapbox .lbl{pointer-events:none}
.mapbox .lbl circle{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.mapbox .lbl text{fill:var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.mapbox .nm{fill:var(--muted);font-size:10.5px;font-family:var(--f-body);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.maprow{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.wwbtn{font:inherit;font-size:13px;display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.wwbtn b{font-family:var(--f-mono)}
.wwbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.legend i{width:18px;height:10px;background:var(--accent);display:block}
.legend span{margin:0 4px}
/* strip */
.strip svg{width:100%;height:auto;display:block}
.strip text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.strip .ax{stroke:var(--line)}
.strip .today{stroke:var(--urgent);stroke-dasharray:2 3}
/* award summary */
.bars{display:grid;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.barrow .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .trk{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.barrow .trk i{display:block;height:100%}
.barrow .num{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.sublabel{font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.suplist{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:13px}
.suplist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:3px}
.suplist li span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
/* readiness */
.ready{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ready li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13.5px}
.ready .box{width:14px;height:14px;border:1.5px solid var(--accent);border-radius:3px;margin-top:3px}
.ready a{color:var(--ink);font-weight:650;text-decoration-color:var(--accent);text-underline-offset:2px}
.ready p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.ready .tag{font-family:var(--f-mono);font-size:11px;margin-left:6px;padding:0 5px;border-radius:3px;border:1px solid currentColor}
/* filters */
.filters{display:grid;gap:12px 22px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.filters>*{min-width:0}
.filters>#aw-wrap,.filters>#tl-wrap,.filters>.only-opps>*,.filters>.fold,.filters>.more-f,.filters>.toast{grid-column:1/-1}
.status{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));column-gap:8px}
@media (max-width:700px){.filters{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .sw{background:transparent!important;outline:1.5px solid currentColor}
.chip.fit{border-style:dashed}
.chip.fit[aria-pressed="false"]{opacity:1;color:var(--muted)}
.chip.fit[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-style:solid;border-color:var(--ink)}
.chip.fit[aria-pressed="true"] .n{color:var(--bg)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label.f{display:grid;gap:3px;font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
select,input[type=search],input[type=text]{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.only-opps{display:contents}
.saved{display:grid;gap:8px}
.saverow{display:flex;gap:6px}
.saverow input{flex:1}
.btn{font:inherit;font-size:13px;font-weight:650;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.savedlist{display:flex;flex-wrap:wrap;gap:6px}
.sv{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12.5px}
.sv button{font:inherit;border:0;background:var(--sunk);color:var(--ink);padding:4px 9px;cursor:pointer}
.sv button.x{background:none;color:var(--muted);padding:4px 7px;border-left:1px solid var(--line)}
.sv.active{border-color:var(--accent)}
.sv.active button:first-child{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{font-size:12px;color:var(--good);min-height:1em}
/* status checklist (Find a Tender style) */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.status{border:0;margin:0;padding:0;display:grid;gap:2px;min-width:0}
.status label{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:6px 6px;border-radius:6px;cursor:pointer}
.status label:hover{background:var(--sunk)}
.status input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--ink);margin:0;display:grid;place-content:center;background:var(--surface);cursor:pointer;grid-row:span 2}
.status input:checked::before{content:"";width:12px;height:6px;border:solid var(--ink);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.status input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.status .nm{font-size:15.5px;font-weight:600;line-height:1.3}
.status .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);align-self:center;grid-row:span 2}
.status .sd{font-size:12px;color:var(--muted);line-height:1.35;grid-column:2}
/* grouped list */
.group{display:grid;gap:8px}
.ghead{position:sticky;top:var(--sticky-h,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;width:100%;font:inherit;text-align:left;background:none;border:0;border-bottom:2px solid var(--ink);padding:8px 2px 6px;cursor:pointer;color:var(--ink)}
.ghead .dot{width:11px;height:11px;transform:rotate(45deg);flex:none}
.ghead .nm{font-family:var(--f-display);font-stretch:112%;font-weight:750;font-size:18px}
.ghead .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ghead .chev{margin-left:auto;font-size:12px;color:var(--muted);transition:transform .15s}
.ghead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.ghint{font-size:12.5px;color:var(--muted);margin:-2px 0 2px}
.more{font:inherit;font-size:13px;justify-self:start;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--accent);cursor:pointer}
.left.past{color:var(--muted);font-weight:500;text-decoration:line-through}
.spill{font-size:11px;font-family:var(--f-mono);border-radius:4px;padding:1px 6px;color:var(--bg);background:var(--st,var(--ink))}
select.big{font-size:15px;font-weight:600;padding:9px 10px}
.viewbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;font-weight:650;border:0;background:none;color:var(--muted);padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
label.f.inline{display:flex;align-items:center;gap:8px}
label.f.inline select{width:auto}
.status input{--sc:var(--ink)}
.status .dot{display:inline-block;width:10px;height:10px;transform:rotate(45deg);margin-right:8px;vertical-align:1px}
/* gantt: own scroll box, sticky title column and time scale */
.gantt{--lab:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
@media (max-width:640px){.gantt{--lab:168px}}
.gbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.gbar .btn{padding:6px 12px}
.gkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.gkey span{display:inline-flex;align-items:center;gap:6px}
.gkey .lg{width:24px;height:10px;border-radius:2px;display:inline-block}
.gkey .lg.wait{border:2px dashed var(--muted);background:none}
.gkey .lg.con{background:var(--muted);opacity:.4;height:6px}
.gkey .dm{width:9px;height:9px;transform:rotate(45deg);display:inline-block}
.gscroll{overflow:auto;height:calc(100vh - var(--sticky-h,0px) - 150px);min-height:340px;max-height:960px;border:1px solid var(--line);border-radius:8px;position:relative;overscroll-behavior-x:contain;scrollbar-width:thin}
.gscroll:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gcontent{position:relative;min-width:100%}
.ghd{position:sticky;top:0;z-index:6;display:flex;background:var(--surface);border-bottom:2px solid var(--ink)}
.gcorner{position:sticky;left:0;z-index:7;width:var(--lab);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:8px 10px;font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:flex-end}
.gscale{position:relative;flex:none;height:48px}
.tier{position:absolute;left:0;height:22px;width:100%}
.tier.t1{top:2px}.tier.t2{top:25px}
.tier span{position:absolute;top:0;height:22px;line-height:22px;padding-left:6px;font-size:11.5px;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line);color:var(--muted);font-family:var(--f-mono)}
.tier.t1 span{color:var(--ink);font-weight:600}
.tier .wk{font-size:11px}
.gtoday-l{position:absolute;bottom:0;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:10px;font-family:var(--f-mono);font-weight:600;padding:1px 6px;border-radius:3px 3px 0 0;z-index:2;font-size:11px}
.gbody{position:relative}
.glines{position:absolute;top:0;bottom:0;left:var(--lab);pointer-events:none;z-index:0}
.glines i{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line)}
.glines .gw{border-left-style:dotted;opacity:.7}
.glines .gy{border-left-color:var(--muted);opacity:.6}
.glines .gtoday{border-left:2px solid var(--accent);opacity:1;z-index:2}
.gg{display:flex;position:relative;z-index:3;background:var(--sunk);border-bottom:1px solid var(--line)}
.gghead{position:sticky;left:0;z-index:4;width:var(--lab);flex:none;display:flex;align-items:center;gap:8px;font:inherit;background:var(--sunk);border:0;padding:9px 10px;cursor:pointer;color:var(--ink);text-align:left}
.gghead .dot{width:10px;height:10px;transform:rotate(45deg);flex:none}
.gghead .nm{font-family:var(--f-display);font-stretch:110%;font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gghead .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gghead .chev{margin-left:auto;font-size:11px;color:var(--muted);transition:transform .15s}
.gghead[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.ggfill{flex:none}
.gr{display:flex;position:relative;height:40px;border-bottom:1px solid var(--line)}
.gr:hover{background:var(--sunk)}
.gl{position:sticky;left:0;z-index:4;width:var(--lab);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:3px 10px;display:flex;align-items:center;min-width:0}
.gr:hover .gl{background:var(--sunk)}
.gl a{display:grid;min-width:0;width:100%;text-decoration:none;color:var(--ink)}
.gl .gtt{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.gl .gtt .dot{width:8px;height:8px;transform:rotate(45deg);display:inline-block;margin-right:7px;vertical-align:1px}
.gl .gsub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:15px}
.gl a:hover .gtt,.gl a:focus-visible .gtt{text-decoration:underline;text-decoration-color:var(--accent)}
.gt{position:relative;flex:none;z-index:1}
.gb{position:absolute;border-radius:4px;overflow:hidden}
.gb.run{top:9px;height:14px}
.gb.run.hot{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.28) 6px 12px)}
.gb.join{opacity:.55}
.gb.wait{top:9px;height:14px;border:2px dashed;background:transparent}
.gb.con{top:27px;height:6px;opacity:.5;border-radius:3px}
.gb.aw,.gb.tool{top:10px;height:20px;display:flex;align-items:center}
.gb.aw.ending{background:var(--accent)}
.gb.aw.cur{background:var(--ink);opacity:.85}
.gb.aw.old{background:var(--muted);opacity:.4}
.gb.tool.act{background:var(--st-active)}
.gb.tool.up{background:var(--st-planned)}
.gb.tool.old{background:var(--muted);opacity:.4}
.gb.tool.join{box-shadow:inset 0 0 0 3px var(--ink);opacity:1}
.gb em{font-style:normal;font-size:11px;font-weight:650;color:var(--bg);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gdm{position:absolute;top:10px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);border:2px solid var(--surface);z-index:2}
.gdm.hollow{background:var(--surface);border-style:solid}
.glab2{position:absolute;top:8px;font-size:11px;font-family:var(--f-mono);white-space:nowrap;color:var(--ink);pointer-events:none;z-index:2}
.glab2.muted{color:var(--muted)}
.gmore .gl{z-index:4}
#gtip{position:fixed;z-index:50;max-width:320px;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 12px;font-size:12px;display:grid;gap:3px;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#gtip[hidden]{display:none}
#gtip b{font-size:13px;line-height:1.3}
#gtip .tb{opacity:.8}
#gtip i{font-style:normal;opacity:.7}
.gnote{font-size:12px;color:var(--muted);margin:0}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap}
.pill.warn{color:var(--warn);border-color:currentColor}
.suplist2{columns:2 220px;column-gap:20px;margin:0;padding:0;list-style:none;font-size:12.5px}
.suplist2 li{break-inside:avoid;padding:1px 0}
.lots{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.lots li{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;border-bottom:1px dotted var(--line);padding-bottom:4px}
.lots li span:last-child{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.skip{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:-60px;z-index:10;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:0 0 8px 8px;font-weight:650;text-decoration:none}
.skip:focus{top:env(safe-area-inset-top,0px)}
.vtools{display:flex;flex-wrap:wrap;gap:6px}
.btn.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn.ghost b{font-family:var(--f-mono);font-weight:600}
#banner:empty,#renew:empty{display:none}
#banner{display:grid;gap:8px}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--surface);font-size:14px}
.banner .btn{font-size:12.5px;padding:4px 10px}
.glance{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 0;font-size:13px}
.glance div{display:flex;gap:5px}
.glance dt{color:var(--muted)}
.glance dd{margin:0;font-weight:600}
.buyer{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.buyer:hover{text-decoration-color:var(--accent);color:var(--ink)}
.dtoggle{font:inherit;font-size:13px;font-weight:650;color:var(--accent);background:none;border:0;padding:8px 0 0;cursor:pointer}
.dtoggle::before{content:"▸ "}
.dtoggle[aria-expanded="true"]::before{content:"▾ "}
.detail{display:grid;gap:14px;margin-top:10px;padding:14px;border-radius:8px;background:var(--sunk)}
.dsec h4{margin:0 0 6px;font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.plain{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px;max-width:72ch}
.ck li{font-size:13px}
.sim{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.sim span{display:block;color:var(--muted);font-size:12px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.links a,.sim a,.blist a{color:var(--accent);font-weight:600}
.star{font:inherit;font-size:20px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;justify-self:end;padding:2px 4px}
.star[aria-pressed="true"]{color:var(--warn)}
.card.starred{border-color:var(--warn)}
dialog#buyer{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px 22px 18px}
dialog#buyer::backdrop{background:rgba(0,0,0,.6)}
dialog#buyer h2{font-family:var(--f-display);font-stretch:112%;font-size:24px;margin:0 70px 10px 0;line-height:1.15}
dialog#buyer h3{font-size:13px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
.dclose{position:absolute;top:14px;right:14px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.bstats,.bsecs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.blist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.blist li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;font-size:13.5px}
.blist .dot{width:9px;height:9px;transform:rotate(45deg);margin-top:5px}
.blist span{display:block;font-size:12px;color:var(--muted)}
/* sticky top bar: tabs, headline numbers and active filters stay in view */
.sentinel{height:1px;margin-bottom:-19px}
.stickybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:grid;gap:10px;padding-block:8px 10px;box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
.stickybar.stuck{box-shadow:0 0 0 100vmax var(--bg),inset 0 -1px 0 var(--line)}
.stickybar .kpi{padding:8px 14px;gap:0;min-width:0}
.stickybar .kpi b{font-size:22px}
.stickybar .kpi span{font-size:11.5px;line-height:1.3}
.toprow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;border-bottom:1px solid var(--line)}
.toprow .tabs{border-bottom:0;flex:1 1 auto;min-width:0}
.search{position:relative;flex:0 1 400px;margin-bottom:6px;color:var(--muted)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none}
.search input{width:100%;font-size:15px;padding:10px 14px 10px 38px;border-radius:999px;background:var(--surface)}
.kmini{display:none}
@media (max-width:640px){.search{flex:1 1 100%;order:-1;margin:0 0 4px}.stickybar .kpis{display:none}.kmini{display:block;font:inherit;font-size:13.5px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}.kmini b{font-family:var(--f-mono)}.kmini .u{color:var(--urgent);font-weight:700}}
.kpi.act{cursor:pointer;position:relative}
.kpi.act:hover{background:var(--sunk)}
.kpi.act span::after{content:" →";color:var(--accent)}
.kpi.act:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:640px){.stickybar .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.stickybar .kpi{padding:6px 8px}.stickybar .kpi b{font-size:16px}.stickybar .kpi span{font-size:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.kpi.act span::after{content:""}}
/* active filters */
.activef{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.activef:empty{display:none}
.activef .lab{color:var(--muted);margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 2px 2px 10px;max-width:100%}
.fchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.fchip button{font:inherit;font-size:14px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 7px;border-radius:999px}
.fchip button:hover{background:var(--accent);color:var(--accent-ink)}
.clearall{font:inherit;font-size:12.5px;font-weight:650;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
/* folds */
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2{flex:1}
.fold>summary::after{content:"▾";color:var(--muted);font-size:12px;transition:transform .15s}
.fold:not([open])>summary::after{transform:rotate(-90deg)}
.fold>summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.panel.fold{gap:0}
.panel.fold[open]{gap:12px}
.more-f,.saved{border-top:1px solid var(--line);padding-top:10px}
.more-f>summary{font-size:13px;font-weight:650;color:var(--ink)}
.more-f>summary b{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.more-f>summary b:empty{display:none}
.morebody{display:grid;gap:12px;padding-top:2px}
.more-f .ctrls{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.saved[open]>summary{margin-bottom:8px}
/* results header */
#results{scroll-margin-top:calc(var(--sticky-h,0px) + 12px)}
.reshead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.reshead .count{font-size:14px;color:var(--ink);font-weight:600}
/* back to top */
.totop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;font:inherit;font-size:13px;font-weight:650;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 14px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.totop:hover{background:var(--accent);color:var(--accent-ink)}


/* list */
.count{font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
.card{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:12px 14px 12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.card .bar{border-radius:0 3px 3px 0}
.card h3{font-size:15px;font-weight:650;margin:0 0 3px;line-height:1.3;text-wrap:pretty}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.desc{font-size:13px;margin:6px 0 0;color:var(--ink);opacity:.85;max-width:72ch}
.win{font-size:13px;margin:6px 0 0}
.win b{font-weight:650}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{font-size:11px;font-family:var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.pill.flag{color:var(--good);border-color:currentColor}
.pill.cpv{cursor:pointer;background:none;font:inherit;font-family:var(--f-mono);font-size:11px}
.pill.cpv:hover{border-color:var(--accent);color:var(--accent)}
.side{text-align:right;display:grid;gap:4px;align-content:start;min-width:92px}
.dl{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.left{font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 6px;justify-self:end;background:var(--sunk)}
.left.hot{background:var(--urgent);color:var(--surface)}
.left.soon{color:var(--warn)}
.left.long{color:var(--muted);font-weight:500}
.left.won{color:var(--good)}
.val{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.val.nd{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
footer{font-size:12.5px;color:var(--muted);display:grid;gap:6px;max-width:90ch}
footer a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){.overview{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hside{justify-items:start}}
@media (min-width:901px){.col.sticky{position:sticky;top:calc(var(--sticky-h,0px) + 14px);align-self:start}.col.sticky.nostick{position:static}}
@media (max-width:480px){.card{grid-template-columns:4px minmax(0,1fr)}.side{grid-column:2;text-align:left;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.left{justify-self:start}.barrow{grid-template-columns:minmax(0,7rem) minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- design review fixes ---- */
/* titles: one size and weight for every panel heading and filter label; subtitles one step down */
.panel h2,label.f,label.f>span,.fold>summary h2,.soon h3{font-family:var(--f-body)!important;font-size:14px!important;font-weight:700!important;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important;line-height:1.3}
label.f select,label.f input{font-weight:600}
.panel h2 .aside,.panel h2 button{font-size:12.5px!important;font-weight:400!important;text-transform:none!important;letter-spacing:0!important}
.panel h2 button{font-weight:650!important}
.sublabel,.dsec h4,dialog#buyer h3{font-family:var(--f-body)!important;font-size:13px!important;font-weight:700!important;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important}
label.f.inline>span{font-size:14px!important}
.buyerf{display:grid;gap:4px;align-content:start}
.combo{position:relative}
.combo input{width:100%;padding-right:36px;cursor:text}
.combo input::placeholder{font-weight:500;color:var(--muted)}
.combo-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.combo-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;max-height:min(340px,50vh);overflow-y:auto;overscroll-behavior:contain;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--field);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.combo-pop li{display:grid;gap:1px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1.3;min-height:44px;align-content:center}
.combo-pop li b{font-weight:600;overflow-wrap:anywhere}
.combo-pop li span{font-size:12px;color:var(--muted)}
.combo-pop li[aria-selected="true"],.combo-pop li:hover{background:var(--sunk)}
.combo-pop li[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent)}
.combo-pop li.none{color:var(--muted);cursor:default}
input.big{font-size:15px;font-weight:600;padding:9px 10px}
.brow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.brow .hint{font-size:12px;color:var(--muted);margin:0}
.brow .btn{padding:4px 10px;font-size:12.5px}
.chsum{margin:0 0 4px;font-size:13.5px;font-weight:600}
.strip .at{font-family:var(--f-body);font-size:12px;font-weight:600;fill:var(--muted)}
.strip .zone{fill:var(--urgent);font-weight:600;font-family:var(--f-body);font-size:11.5px}
.strip line.grid{stroke:var(--line);stroke-width:1}
.strip line.base{stroke:var(--muted);stroke-width:1}
.chleg{margin-top:4px}
.soon{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.soon h3{margin:0;font-size:14px;font-weight:700}
.soonl{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.soonl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.soonl .sd{font-size:11.5px;font-weight:700;border-radius:4px;padding:3px 6px;background:var(--sunk);text-align:center;white-space:nowrap}
.soonl .sd.hot{background:var(--urgent);color:#fff}
.soonl a{color:var(--ink);font-weight:650;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soonl a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.soonl div{min-width:0}
.soonl div span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon .btn{justify-self:start}
select,input[type=search],input[type=text]{border-color:var(--field)}
.panel h2,.dsec h4,dialog#buyer h3,.sublabel,label.f{font-family:var(--f-body);text-transform:none;letter-spacing:0}
.panel h2{font-size:14px;font-weight:700;color:var(--ink)}
.panel h2 .aside{font-size:12.5px;font-weight:400;color:var(--muted)}
.panel h2 button{font-size:12.5px}
.dsec h4{font-size:13px;font-weight:700;color:var(--ink)}
dialog#buyer h3{font-size:14px;font-weight:700;color:var(--ink)}
.sublabel{font-size:12.5px;font-weight:650;color:var(--ink)}
label.f{font-size:12.5px;font-weight:650;color:var(--ink)}
.mapbox path.on,.mapbox path:focus-visible{stroke:var(--ink)}
.mapbox path:hover{stroke:var(--ink)}
@media (pointer:coarse),(max-width:640px){
  .pill.cpv{min-height:34px;padding:6px 10px}
  .fchip button{min-width:40px;min-height:40px;font-size:18px}
  .star{min-width:44px;min-height:44px;font-size:24px}
  .dtoggle{min-height:44px}

/* ---- filter row alignment: Sector, Council and Buyer share one title line and one box height ---- */
.filters{align-items:start}
label.f{align-content:start}
.buyerf{gap:3px}
.buyerf>label.f{display:block}
select.big,input.big{height:46px;box-sizing:border-box;padding:0 40px 0 12px;font-size:15px;font-weight:600;line-height:1.2;border-radius:8px;background-color:var(--bg)}
select.big{appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer;text-overflow:ellipsis;

[hidden]{display:none!important}

/* red is for urgency and the one primary action; everything else is ink */
.btn.ghost{color:var(--ink);border-color:var(--field)}

.btn.ghost[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost.plain{border-color:transparent;text-decoration:underline;text-decoration-color:var(--field);text-underline-offset:3px}

.btn.ghost.plain[aria-pressed="true"]{text-decoration:none}
.soon .btn.ghost{border-color:var(--field)}
.more,.dtoggle,.clearall,.panel h2 button,footer a{color:var(--ink)}
.dtoggle::first-letter{color:var(--accent)}
.links a,.sim a,.blist a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--field);text-underline-offset:2px}
.links a:hover,.sim a:hover,.blist a:hover{text-decoration-color:var(--ink)}
.panel h2 button{text-decoration:underline;text-underline-offset:2px}
.lang button[aria-pressed="true"]{background:#fff;color:#111}
.sv.active{border-color:var(--ink)}.sv.active button:first-child{background:var(--ink);color:var(--bg)}

.spill{background:none!important;color:var(--ink)!important;border:1px solid var(--line);font-family:var(--f-body)!important;font-weight:650;font-size:11.5px!important;display:inline-flex;align-items:center;gap:6px;padding:1px 7px 1px 6px}

/* mono only for numbers */
.pill{font-family:var(--f-body);font-size:11.5px}
.pill.cpv{font-family:var(--f-mono)}
.dl{font-family:var(--f-body);font-size:12.5px;color:var(--muted)}
.dl br+*,.dl{line-height:1.45}
.tier span{font-family:var(--f-body)}
.gtoday-l{bottom:auto;top:3px;border-radius:3px;font-family:var(--f-body)}
/* status checklist: count on the title line, description under the title */
.status label{grid-template-columns:26px minmax(0,1fr) auto;align-items:start}
.status input{grid-row:1;grid-column:1;align-self:start}
.status .nm{grid-column:2;grid-row:1;align-self:start;padding-top:1px}
.status .n{grid-column:3;grid-row:1;align-self:start;padding-top:4px}
.status .sd{grid-column:2/4;grid-row:2;margin-top:2px}

/* busiest councils */
.topla{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.topla h3{margin:0}
.topla ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.topla button{width:100%;display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font:inherit;font-size:13.5px;background:none;border:0;border-radius:6px;padding:6px 6px;color:var(--ink);cursor:pointer;text-align:left;min-height:36px}
.topla button:hover{background:var(--sunk)}
.topla button[aria-pressed="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.topla .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.topla .tb{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.topla .tb i{display:block;height:100%;background:var(--accent);opacity:.75}
.topla .tc{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
/* chart: expected tenders are outlined so they stay visible */
.chleg i.exp{background:color-mix(in srgb,var(--accent) 20%,transparent);outline:1px solid var(--accent);outline-offset:-1px}
/* header: data date lives in the footer note */
#badge{display:none}
.glab2,.gcorner,.ready .tag{font-family:var(--f-body)}
.gcorner{text-transform:none;letter-spacing:0;font-weight:650}
@media (max-width:440px){.tabs button{padding:10px 8px 9px;font-size:14px}.tabs button .n{display:none}}

/* buyer box: identical to the other menus until you type */

.blink{font:inherit;font-size:12.5px;font-weight:650;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--field);text-underline-offset:2px;white-space:nowrap}
.blink:hover{text-decoration-color:var(--ink)}
.combo input.big{background-color:var(--bg);background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 21px) 52%,calc(100% - 16px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px;cursor:pointer;text-overflow:ellipsis}
.combo input.big:focus{cursor:text}
.combo input.big:not(:focus)::placeholder{color:var(--ink);font-weight:600;opacity:1}
.combo input.big:focus::placeholder{color:var(--muted);font-weight:500}
.combo-btn{right:0;top:0;transform:none;width:44px;height:100%;background:none}

/* buyer list styled like the native council/sector menus */
.combo-pop{padding:5px;border-radius:10px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:min(420px,60vh)}
.combo-pop li{display:grid!important;grid-template-columns:16px minmax(0,1fr);gap:4px;align-items:center;min-height:30px!important;padding:4px 10px 4px 6px!important;border-radius:6px;font-size:15px!important;font-weight:400;line-height:1.25;box-shadow:none!important;background:none}
.combo-pop li .tk{font-size:13px;text-align:center;color:var(--ink)}
.combo-pop li .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.combo-pop li.none,.combo-pop li.none:hover{background:none!important;color:var(--muted);cursor:default}
@media (pointer:coarse){.combo-pop li{min-height:40px!important}}
.combo-pop li span.bn{font-size:15px;color:inherit}
.combo-pop li span.tk{font-size:13px;color:inherit}
.combo-pop li.none span.bn{color:var(--muted)}
.combo-pop li:hover,.combo-pop li[aria-selected="true"]{background:#2470e6!important;color:#fff!important}
.combo-pop li:hover span,.combo-pop li[aria-selected="true"] span{color:#fff!important}

/* ---- round 3 ---- */
.pill.eco{color:var(--good);border-color:currentColor;font-weight:600}
.pill.cyl{color:var(--ink);border-color:var(--ink);font-weight:600}
.pill.match{font-weight:700;border-color:currentColor}
.pill.match.hi{color:var(--good)}.pill.match.mid{color:var(--warn)}.pill.match.lo{color:var(--muted)}

.supl{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--field);text-underline-offset:2px;text-align:left}

.win .supl{font-weight:600}
.dsec.carbon{border-left:3px solid var(--good);padding-left:10px}
.pg{margin:0 0 6px;font-size:13.5px}
.pgbar{position:relative;height:12px;background:var(--sunk);border-radius:6px;margin:4px 0 2px}
.pgbar .iqr{position:absolute;top:0;bottom:0;background:var(--ink);opacity:.25;border-radius:6px}
.pgbar .med{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.pgbar .me{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;margin-top:5px;background:var(--accent);transform:rotate(45deg)}
.pgaxis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--f-mono);margin-bottom:6px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;margin:6px 0 2px}
.mo{display:grid;justify-items:center;gap:2px}
.mo .mb{display:flex;align-items:flex-end;width:100%;height:64px;background:var(--sunk);border-radius:4px;overflow:hidden}

.mo.pk .mb i{background:var(--accent);opacity:1}
.mo b{font-size:11px;font-family:var(--f-mono);min-height:1em}
.mo .ml{font-size:11px;color:var(--muted)}
.eyebrow2{margin:0;font-size:12px;font-weight:650;color:var(--muted)}
.btn.foryou{border-color:var(--good);color:var(--good)}
.btn.foryou[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
dialog.sheet.wide{width:min(760px,calc(100vw - 32px))}
.pform{display:grid;gap:14px}
.pform fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;min-width:0}
.pform legend{font-weight:700;font-size:14px;padding:0 4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px}
.pgrid.tall{max-height:240px;overflow-y:auto;padding-right:4px}
.pck{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:4px 2px;cursor:pointer}
.pck input{margin-top:2px;width:16px;height:16px;flex:none;accent-color:var(--ink)}
.prow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.prow label.f{min-width:160px}
.briefbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.briefbar .dclose{margin-left:auto;position:static}
.brief h2{margin:2px 0 8px;font-size:20px}
.brief h3{font-size:14px;margin:16px 0 6px}
.brief table{width:100%;border-collapse:collapse;font-size:12.5px}
.brief th,.brief td{text-align:left;vertical-align:top;padding:5px 6px;border-bottom:1px solid var(--line)}
.brief th{font-size:12px;color:var(--muted);font-weight:650}
.brief td a{color:var(--ink);font-weight:600}
.bk{display:flex;flex-wrap:wrap;gap:8px 24px;margin:8px 0}
.bk div{display:grid}.bk b{font-size:20px}.bk span{font-size:12px;color:var(--muted)}
@media print{
  body.printing-brief > *:not(main),body.printing-brief main > *:not(#brief-dlg){display:none!important}
  body.printing-brief main{display:block!important;padding:0!important;margin:0!important;max-width:none!important}

  body.printing-brief .noprint{display:none!important}
  .brief td a{text-decoration:none}
}
.pill.new{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
</style>

/* ---------- left panels ---------- */
function renderStrip(list){
  const max=42,W=Math.max(300,Math.round($("strip").clientWidth||560)),H=250;
  const ml=46,mr=10,mt=26,mb=52,cw=W-ml-mr,ch=H-mt-mb,axisY=mt+ch;
  const bw=cw/(max+1),x=d=>ml+d*bw;
  const days=Array.from({length:max+1},()=>({dl:0,ex:0}));
  let later=0;
  list.forEach(n=>{const d=daysLeft(n);if(d===null||d<0||d>max){later++;return;}isDeadline(n)?days[d].dl++:days[d].ex++;});
  const peak=Math.max(1,...days.map(o=>o.dl+o.ex));
  const step=(()=>{const raw=peak/4,p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,5,10])if(m*p>=raw)return Math.max(1,m*p);return 10*p;})();
  const top=Math.ceil(peak/step)*step,sy=v=>v/top*ch;
  const dateOf=d=>new Date(TODAY.getTime()+d*dayMs);
  const fmtS=dt=>{try{return dt.toLocaleDateString(lang==="cy"?"cy-GB":"en-GB",{day:"numeric",month:"short"});}catch(e){return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short"});}};
  let g="";
  /* 14-day zone */
  g+=`<rect x="${x(0)}" y="${mt}" width="${x(15)-x(0)}" height="${ch}" fill="var(--urgent)" opacity=".07"/><text class="zone" x="${x(0)+6}" y="${mt-8}">${esc(t("next14"))}</text>`;
  /* y grid + ticks */
  for(let v=0;v<=top;v+=step){const y=axisY-sy(v);g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" class="${v?"grid":"base"}"/><text class="yt" x="${ml-8}" y="${y+4}" text-anchor="end">${v}</text>`;}
  /* bars */

const ZOOM={w:18,m:4,q:1.4};

const dt0=s=>new Date(s+"T00:00:00");
function ganttGroups(list){
  const tab=state.tab;
  if(tab==="opps"){
    const dkey=n=>{const d=daysLeft(n);if(d===null)return 1e9;return d<0?5e8-d:d;};

function renderGantt(list){
  const tab=state.tab,Z=ZOOM[state.zoom]||ZOOM.m;
  const back={opps:45,awards:540,tools:540}[tab];
  const start=new Date(TODAY.getTime()-back*dayMs);start.setDate(1);
  let maxEnd=new Date(TODAY.getFullYear()+1,TODAY.getMonth()+1,1);
  const ends=list.map(n=>tab==="opps"?(n.ce||n.nd):tab==="awards"?n.ce:n.end).filter(Boolean).map(dt0).filter(d=>!isNaN(d));
  ends.forEach(d=>{if(d>maxEnd)maxEnd=d;});
  const cap=new Date(TODAY.getFullYear()+(tab==="opps"?5:7),TODAY.getMonth(),1);if(maxEnd>cap)maxEnd=cap;
  const end=new Date(maxEnd.getFullYear(),maxEnd.getMonth()+2,1);
  const X=d=>((d instanceof Date?d:dt0(d))-start)/dayMs*Z;
  const W=Math.ceil(X(end));
  const clampX=d=>Math.max(0,Math.min(W,X(d)));
  /* scale */
  let top="",bot="",lines="";
  for(let m=new Date(start);m<end;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    const nx=new Date(m.getFullYear(),m.getMonth()+1,1),x=X(m),w=X(nx)-x,mo=m.getMonth();
    if(state.zoom==="w"){top+=`<span style="left:${x}px;width:${w}px">${monthName(m,true)} ${m.getFullYear()}</span>`;lines+=`<i class="gm" style="left:${x}px"></i>`;}
    else if(state.zoom==="m"){if(mo===0||+m===+start)top+=`<span style="left:${x}px;width:${X(new Date(m.getFullYear()+1,0,1))-x}px">${m.getFullYear()}</span>`;bot+=`<span style="left:${x}px;width:${w}px">${monthName(m)}</span>`;lines+=`<i class="${mo===0?"gy":"gm"}" style="left:${x}px"></i>`;}
    else{if(mo===0||+m===+start)top+=`<span style="left:${x}px;width:${X(new Date(m.getFullYear()+1,0,1))-x}px">${m.getFullYear()}</span>`;if(mo%3===0){bot+=`<span style="left:${x}px;width:${X(new Date(m.getFullYear(),mo+3,1))-x}px">${lang==="cy"?"Ch":"Q"}${mo/3+1}</span>`;lines+=`<i class="${mo===0?"gy":"gm"}" style="left:${x}px"></i>`;}}
  }
  if(state.zoom==="w"){for(let d=new Date(start);d<end;d=new Date(d.getTime()+dayMs)){if(d.getDay()===1){const x=X(d);bot+=`<span class="wk" style="left:${x}px;width:${7*Z}px">${d.getDate()}</span>`;lines+=`<i class="gw" style="left:${x}px"></i>`;}}}
  const tx0=X(TODAY);
  /* rows */
  const groups=ganttGroups(list);G.rows=[];
  let body="";
  for(const g of groups){
    if(!g.items.length)continue;
    const nShown=groups.filter(x=>x.items.length).length;
    const open=nShown===1||!state.collapsed.has(g.key),lim=shown["g:"+g.key]||50;
    body+=`<div class="gg"><button type="button" class="gghead" data-ggroup="${g.key}" aria-expanded="${open}"><span class="dot" style="background:${g.color}"></span><span class="nm">${esc(g.label)}</span><span class="n">${g.items.length}</span><span class="chev" aria-hidden="true">▼</span></button><div class="ggfill" style="width:${W}px"></div></div>`;

function ganttLabel(n,i){
  const tab=state.tab;let sub,dot;
  if(tab==="opps"){dot=stCol(n.st);sub=`${n.b} · ${NDT[n.ndt]?NDT[n.ndt][lang==="cy"?1:0]:""} ${n.nd?shortDate(n.nd):t("tbc")}`;}
  else if(tab==="awards"){dot=endingSoon(n)?"var(--accent)":n.cs_status==="active"?"var(--ink)":"var(--muted)";sub=`${n.b} · ${n.sup[0]||t("notNamed")}${n.sup.length>1?" +"+(n.sup.length-1):""}`;}
  else{dot=n.st==="active"?"var(--st-active)":n.st==="upcoming"?"var(--st-planned)":"var(--muted)";sub=`${n.b} · ${n.nsup} ${t("gSupShort")}`;}
  const title=tab==="opps"?titleFor(n):n.t;
  return `<div class="gl"><a href="${n.u}" target="_blank" rel="noopener" data-gi="${i}"><span class="gtt"><i class="dot" style="background:${dot}"></i>${esc(title)}</span><span class="gsub">${esc(sub)}${n.v?" · "+gbp(n.v):""}</span><span class="vh"> ${t("opensNew")}</span></a></div>`;
}
function ganttBars(n,i,X,clampX,W,tx0){
  const tab=state.tab;let h="";
  const bar=(a,b,cls,style,inner)=>{const x1=clampX(a),x2=clampX(b);if(x2<=0||x1>=W||x2-x1<1)return "";return `<span class="gb ${cls}" data-gi="${i}" style="left:${x1}px;width:${Math.max(3,x2-x1)}px;${style||""}">${inner||""}</span>`;};
  const label=(x,txt,cls)=>`<span class="glab2 ${cls||""}" style="left:${x}px">${esc(txt)}</span>`;
  if(tab==="opps"){
    const c=stCol(n.st),d=daysLeft(n);
    if(n.cs&&n.ce)h+=bar(n.cs,n.ce,"con","background:"+col(n.s));
    if(n.nd){
      const x=X(n.nd);
      if(d!==null&&d>=0){
        if(isDeadline(n)){h+=bar(TODAY,dt0(n.nd),"run"+(d<=14?" hot":""),"background:"+c);}
        else if(n.st==="dps"){h+=bar(TODAY,dt0(n.nd),"run join","background:"+c);}
        else h+=bar(TODAY,dt0(n.nd),"wait","border-color:"+c);
        if(x<=W){h+=`<span class="gdm" data-gi="${i}" style="left:${x}px;background:${c}"></span>`;
          h+=label(x+10,(isDeadline(n)?(d===0?t("closesToday"):d===1?t("left1"):t("leftN",{n:d})):shortDate(n.nd)+" "+new Date(n.nd).getFullYear()));}
      }else if(x>=0){h+=`<span class="gdm hollow" data-gi="${i}" style="left:${x}px;border-color:${c}"></span>`+label(x+10,t("datePassedShort")+" "+shortDate(n.nd),"muted");}
      else h+=`<span class="gdm hollow" data-gi="${i}" style="left:4px;border-color:${c}"></span>`+label(14,"◂ "+t("datePassedShort")+" "+fmtDate(n.nd),"muted");
    }
  }else if(tab==="awards"){
    const es=endingSoon(n),cls=es?"aw ending":n.cs_status==="active"?"aw cur":"aw old";
    if(n.cs&&n.ce){const x1=clampX(n.cs),x2=clampX(n.ce),w=x2-x1;const who=n.sup[0]||"";
      h+=bar(n.cs,n.ce,cls,"",w>150?`<em>${esc(who)}</em>`:"");
      if(w<=150&&x2<W-10)h+=label(x2+6,who?who:fmtDate(n.ce),"muted");
      if(es)h+=`<span class="gdm" data-gi="${i}" style="left:${X(n.ce)}px;background:var(--accent)"></span>`;}
  }else{
    const cls=n.st==="active"?"tool act":n.st==="upcoming"?"tool up":"tool old";
    if(n.start&&n.end){const x1=clampX(n.start),x2=clampX(n.end),w=x2-x1;const txt=`${toolTypeName(n)} · ${n.nsup} ${t("gSupShort")}${joinable(n)?" · "+t("tlJoin"):""}`;
      h+=bar(n.start,n.end,cls+(joinable(n)?" join":""),"",w>190?`<em>${esc(txt)}</em>`:"");
      if(w<=190&&x2<W-10)h+=label(x2+6,txt,"muted");}
  }
  if(!h)h=label(tx0+8,t("noDates"),"muted");
  return h;
}
function ganttTip(n){
  const tab=state.tab;const rows=[];
  if(tab==="opps"){rows.push([tx(STATUSES[n.st])]);if(n.nd)rows.push([NDT[n.ndt]?NDT[n.ndt][lang==="cy"?1:0]:"",fmtDate(n.nd)]);if(n.cs)rows.push([t("contractPeriod"),`${fmtDate(n.cs)} – ${fmtDate(n.ce)}`]);}
  else if(tab==="awards"){rows.push([t(n.cs_status==="active"?"aCurrent":"aEnded")]);rows.push([t(n.sup.length>1?"winners":"winner"),n.sup.join(", ")||t("notNamed")]);rows.push([t("gRuns"),`${fmtDate(n.cs)} – ${fmtDate(n.ce)}`]);}
  else{rows.push([toolTypeName(n)+" · "+t("tl"+n.st[0].toUpperCase()+n.st.slice(1))]);rows.push([t("gRuns"),`${fmtDate(n.start)} – ${fmtDate(n.end)}`]);rows.push([t("gOnIt"),String(n.nsup)]);}

  return `<b>${esc(tab==="opps"?titleFor(n):n.t)}</b><span class="tb">${esc(n.b)}</span>${rows.map(r=>`<span>${r.length>1?`<i>${esc(r[0])}</i> ${esc(r[1])}`:esc(r[0])}</span>`).join("")}`;
}
(function(){
  const tip=document.createElement("div");tip.id="gtip";tip.hidden=true;tip.setAttribute("role","tooltip");document.body.appendChild(tip);

    const r=tip.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;

  document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("#gantt [data-gi]");if(el)show(el,e.clientX,e.clientY);else tip.hidden=true;});
  document.addEventListener("mousemove",e=>{if(tip.hidden)return;const el=e.target.closest&&e.target.closest("#gantt [data-gi]");if(el)show(el,e.clientX,e.clientY);});
  document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("#gantt a[data-gi]");if(el){const r=el.getBoundingClientRect();show(el,r.right,r.top);}else tip.hidden=true;});

function copyRows(){
  const list=visible(),tab=state.tab;
  const clean=s=>String(s??"").replace(/[\t\r\n]+/g," ");
  let head,rows;
  if(tab==="opps"){head=["Status","Title","Buyer","Councils","Sector","Next date type","Next date","Contract start","Contract end","Value (GBP)","CPV","SME","Link"];
    rows=list.map(n=>[STATUSES[n.st].en,n.t,n.b,n.las.join("; ")||"Wales-wide",SECTORS[n.s].en,NDT[n.ndt]?NDT[n.ndt][0]:"",n.nd||"",n.cs||"",n.ce||"",n.v||"",n.cpv.join(" "),n.sme?"Yes":"",n.u]);}
  else if(tab==="tools"){head=["Status","Title","Buyer","Councils","Sector","Type","Start","End","Lots","Suppliers on it","Value inc. VAT (GBP)","Fee","CPV","Link"];
    rows=list.map(x=>[x.st,x.t,x.b,x.las.join("; ")||"Wales-wide",SECTORS[x.s].en,x.typeLabel,x.start||"",x.end||"",x.nlots,x.nsup,x.v||"",x.fee||"",x.cpv.join(" "),x.u]);}
  else{head=["Status","Title","Buyer","Councils","Sector","Winner(s)","Signed","Start","End","Value (GBP)","SME winner","CPV","Link"];
    rows=list.map(n=>[n.cs_status,n.t,n.b,n.las.join("; ")||"Wales-wide",SECTORS[n.s].en,n.sup.join("; "),n.ad||"",n.cs||"",n.ce||"",n.v||"",n.sme?"Yes":"",n.cpv.join(" "),n.u]);}
  const tsv=[head,...rows].map(r=>r.map(clean).join("\t")).join("\n");

  const tools=state.tab==="tools",awds=state.tab==="awards";

  $("aw-wrap").hidden=!awds;$("tl-wrap").hidden=!tools;
  document.querySelectorAll("[data-awst]").forEach(b=>{const k=b.dataset.awst;b.setAttribute("aria-pressed",state.awSt.has(k));b.querySelector(".n").textContent=DATA.awards.filter(a=>a.cs_status===k&&awMatch(a,"awst")&&laMatch(a)).length;});
  {const b=document.querySelector("[data-awend]");b.setAttribute("aria-pressed",state.awEnding);b.querySelector(".n").textContent=DATA.awards.filter(a=>endingSoon(a)&&awMatch(a,"awend")&&laMatch(a)).length;}

    $("k2").textContent=list.filter(n=>{const d=daysLeft(n);return isDeadline(n)&&d!==null&&d>=0&&d<=14;}).length;$("k2l").textContent=t("kOpps2");$("k2box").classList.add("urgent");
    {const vs=list.map(n=>n.v).filter(v=>v>0).sort((a,b)=>a-b),med=vs.length?(vs.length%2?vs[(vs.length-1)/2]:(vs[vs.length/2-1]+vs[vs.length/2])/2):0;
     $("k3").textContent=vs.length?gbp(med):"–";$("k3l").textContent=t("kOpps3");$("k3").parentNode.title=t("typicalTip",{v:gbp(vs.reduce((a,v)=>a+v,0))});}

/* price guide from awarded contracts with a published value */
function quant(a,q){const i=(a.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo);}
function priceGuide(n){
  if(!n.cpv.length)return null;
  for(const len of [5,4,3,2]){
    const pre=n.cpv[0].slice(0,len);
    const pool=DATA.awards.filter(a=>a.v>0&&a.cpv.some(c=>c.startsWith(pre)));
    if(pool.length>=5){const vs=pool.map(a=>a.v).sort((x,y)=>x-y);
      const loc=n.las.length===1?pool.filter(a=>a.las.includes(n.las[0])).map(a=>a.v).sort((x,y)=>x-y):[];
      return {pre,n:vs.length,m:quant(vs,.5),a:quant(vs,.25),b:quant(vs,.75),loc:loc.length>=3?{n:loc.length,m:quant(loc,.5),la:n.las[0]}:null};}
  }
  return null;
}

    <h3>${t("spBuyers")}</h3><p class="hint">${Object.entries(buyers).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([b,c])=>`<button type="button" class="supl" data-buyer="${esc(b)}">${esc(b)}</button>${c>1?` (${c})`:""}`).join(", ")||"–"}</p>
    <h3>${t("spAwards")}</h3>${aw.length?`<ul class="blist">${aw.slice(0,30).map(li).join("")}</ul>`:""}
    <h3>${t("spTools")}</h3>${tls.length?`<ul class="blist">${tls.slice(0,20).map(x=>`<li><span class="dot" style="background:var(--st-planned)" aria-hidden="true"></span><div><a href="${x.u}" target="_blank" rel="noopener">${esc(x.t)}</a><span>${esc(x.b)} · ${esc(toolTypeName(x))} · ${t("ends")} ${fmtDate(x.end)}</span></div></li>`).join("")}</ul>`:`<p class="hint">${t("spNoTools")}</p>`}`;
  const dlg=$("buyer");if(!dlg.open)lastFocus=document.activeElement;
  if(dlg.open){dlg.scrollTop=0;}else if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
  $("buyer-close").focus();
}
/* business profile and match scores */
var PROFILE=store.get("wtp-profile",null);
var SCORES=new Map();
function matchScore(n){
  if(!PROFILE)return 0;if(SCORES.has(n.id))return SCORES.get(n.id);
  const P=PROFILE;let s=0;
  const divs=P.divs||[],secs=P.sectors||[];
  if(divs.length||secs.length){
    if(divs.length&&n.cpv.some(c=>divs.some(d=>c.startsWith(d))))s+=45;
    else if(secs.includes(n.s))s+=30;
    else {SCORES.set(n.id,0);return 0;}
  } else s+=30;
  const las=P.las||[];
  if(las.length){if(n.las.some(l=>las.includes(l)))s+=25;else if(!n.las.length)s+=20;else {SCORES.set(n.id,0);return 0;}}
  else s+=25;
  const lo=+P.vmin||0,hi=+P.vmax||0;
  if(!lo&&!hi)s+=15;else if(!n.v)s+=8;else if(n.v>=lo&&(!hi||n.v<=hi))s+=15;
  if(P.sme&&n.sme)s+=5;if(P.vcse&&n.vcse)s+=5;if(P.welsh&&n.cyl)s+=5;if(P.lc&&(n.lc||crpLikely(n)))s+=5;
  s=Math.min(100,s);SCORES.set(n.id,s);return s;
}
function matchPill(n){if(!PROFILE)return "";const s=matchScore(n);if(!s)return "";return `<span class="pill match ${s>=80?"hi":s>=50?"mid":"lo"}">${t("pMatch",{n:s})}</span>`;}
const VSTEPS=[0,10e3,25e3,50e3,100e3,250e3,500e3,1e6,5e6,25e6,100e6];
function openProfile(){
  const P=PROFILE||{};const divsPresent=[...new Set(DATA.notices.flatMap(n=>n.cpv.map(c=>c.slice(0,2))))].filter(d=>DIV[d]).sort();
  const ck=(name,val,on,label)=>`<label class="pck"><input type="checkbox" name="${name}" value="${esc(val)}"${on?" checked":""}><span>${esc(label)}</span></label>`;
  const vopt=(sel)=>VSTEPS.map(v=>`<option value="${v}"${+sel===v?" selected":""}>${v?gbp(v):t("profAny")}</option>`).join("");
  $("prof-body").innerHTML=`<h2 id="prof-title">${t("profTitle")}</h2><p class="hint">${t("profIntro")}</p>
   <form id="prof-form" class="pform">
    <fieldset><legend>${t("profSectors")}</legend><div class="pgrid">${ALL_SECTORS.map(s=>ck("sec",s,(P.sectors||[]).includes(s),tx(SECTORS[s]))).join("")}</div></fieldset>
    <fieldset><legend>${t("profDivs")}</legend><div class="pgrid tall">${divsPresent.map(d=>ck("div",d,(P.divs||[]).includes(d),d+" · "+(lang==="cy"?DIV[d][1]:DIV[d][0]))).join("")}</div></fieldset>
    <fieldset><legend>${t("profLas")}</legend><p class="hint">${t("profLasAll")}</p><div class="pgrid">${GEO.las.map(l=>l.n).sort().map(l=>ck("la",l,(P.las||[]).includes(l),laName(l))).join("")}</div></fieldset>
    <fieldset><legend>${t("profValue")}</legend><div class="prow"><label class="f">${t("profMin")}<select name="vmin">${vopt(P.vmin||0)}</select></label><label class="f">${t("profMax")}<select name="vmax">${vopt(P.vmax||0)}</select></label></div></fieldset>
    <fieldset><legend>${t("profAbout")}</legend><div class="pgrid">${ck("sme","1",P.sme,t("profSme"))}${ck("vcse","1",P.vcse,t("profVcse"))}${ck("welsh","1",P.welsh,t("profWelsh"))}${ck("lc","1",P.lc,t("profLc"))}</div></fieldset>
    <p class="hint" id="prof-msg" role="status"></p>
    <div class="prow"><button type="submit" class="btn">${t("profSave")}</button>${PROFILE?`<button type="button" class="btn ghost" id="prof-clear">${t("profClear")}</button>`:""}</div>
   </form>`;
  const f=$("prof-form");
  f.onsubmit=e=>{e.preventDefault();const all=nm=>[...f.querySelectorAll(`input[name="${nm}"]:checked`)].map(i=>i.value);
    const P2={sectors:all("sec"),divs:all("div"),las:all("la"),vmin:+f.vmin.value,vmax:+f.vmax.value,sme:!!all("sme").length,vcse:!!all("vcse").length,welsh:!!all("welsh").length,lc:!!all("lc").length};
    if(!P2.sectors.length&&!P2.divs.length){$("prof-msg").textContent=t("profNeed");return;}
    if(P2.vmax&&P2.vmin>P2.vmax){const x=P2.vmin;P2.vmin=P2.vmax;P2.vmax=x;}
    PROFILE=P2;SCORES=new Map();store.set("wtp-profile",P2);closeDlg("prof-dlg");
    state.tab="opps";state.forYou=true;state.sort="match";buildSort();state.sort="match";$("sort").value="match";shown={};render();toast(t("profSaved"));$("results").focus();};
  const c=$("prof-clear");if(c)c.onclick=()=>{PROFILE=null;SCORES=new Map();try{localStorage.removeItem("wtp-profile");}catch(e){}state.forYou=false;closeDlg("prof-dlg");buildSort();render();toast(t("profCleared"));};
  openDlg("prof-dlg");
}
var dlgReturn={};
function openDlg(id){const d=$(id);dlgReturn[id]=document.activeElement;if(d.open)return;if(d.showModal)d.showModal();else d.setAttribute("open","");const c=d.querySelector(".dclose");if(c)c.focus();}
function closeDlg(id){const d=$(id);if(d.close)d.close();else d.removeAttribute("open");const r=dlgReturn[id];if(r&&r.focus)r.focus();}
function renderForYou(){
  const b=$("foryou");if(!b)return;const on=state.forYou&&!!PROFILE;
  b.hidden=state.tab!=="opps";
  const n=PROFILE?DATA.notices.filter(x=>oppMatch(x,"foryou")&&laMatch(x)&&matchScore(x)>=50).length:0;
  b.textContent=PROFILE?t("forYouN",{n}):t("forYou");b.setAttribute("aria-pressed",on);
  $("prof-btn").hidden=state.tab!=="opps"||!PROFILE;
}
/* printable client brief */
function briefData(){
  const list=visible().slice();const tab=state.tab;
  const dk=n=>{const d=daysLeft(n);return d===null?1e9:d<0?5e8-d:d;};
  const so={opps:(a,b)=>(PROFILE&&state.forYou?matchScore(b)-matchScore(a):0)||(dk(a)-dk(b)),awards:(a,b)=>(b.ad||"").localeCompare(a.ad||""),tools:(a,b)=>(a.end||"9").localeCompare(b.end||"9")}[tab];
  list.sort(so);return list;
}
function openBrief(){
  const list=briefData(),tab=state.tab,top=list.slice(0,25);
  const f=activeFilters().map(x=>x[1]);
  const cols=t(tab==="opps"?"briefCols":tab==="awards"?"briefColsAw":"briefColsTl").split("|");
  const row=n=>tab==="opps"?[titleFor(n)+(PROFILE&&state.forYou?` (${matchScore(n)}%)`:""),n.b,placeName(n),n.v?gbp(n.v):"–",(NDT[n.ndt]?NDT[n.ndt][lang==="cy"?1:0]+" ":"")+fmtDate(n.nd)]
    :tab==="awards"?[n.t,n.b,n.sup.slice(0,2).join(", ")||"–",n.v?gbp(n.v):"–",fmtDate(n.ce)]:[n.t,n.b,String(n.nsup||0),n.v?t("upTo",{v:gbp(n.v)}):"–",fmtDate(n.end)];
  const buyers={};list.forEach(n=>{buyers[n.b]=(buyers[n.b]||0)+1;});
  const soon=tab==="opps"?list.filter(n=>isDeadline(n)&&daysLeft(n)!==null&&daysLeft(n)>=0&&daysLeft(n)<=14).length:0;
  const today=fmtDate(TODAY_S);
  $("brief-body").innerHTML=`<article class="brief"><p class="eyebrow2">${t("title")} · ${esc(t("briefFor",{d:today}))}</p><h2 id="brief-title">${t("briefTitle")}: ${esc(t(tab==="opps"?"tabOpps":tab==="awards"?"tabAwards":"tabTools"))}</h2>
    <p><b>${t("briefFilters")}:</b> ${esc(f.length?f.join(" · "):t("briefNone"))}</p>
    <div class="bk"><div><b>${list.length}</b><span>${esc($("k1l").textContent)}</span></div>${tab==="opps"?`<div><b>${soon}</b><span>${esc(t("briefSoon",{n:""}).trim())}</span></div>`:""}<div><b>${esc($("k3").textContent)}</b><span>${esc($("k3l").textContent)}</span></div><div><b>${Object.keys(buyers).length}</b><span>${esc($("k4l").textContent||"")}</span></div></div>
    <h3>${esc(t("briefTop",{n:top.length,t:list.length}))}</h3>
    <table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${top.map(n=>{const r=row(n);return `<tr><td><a href="${n.u}">${esc(r[0])}</a></td>${r.slice(1).map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`;}).join("")}</tbody></table>
    <h3>${t("briefBuyers")}</h3><p>${Object.entries(buyers).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([b,c])=>`${esc(b)} (${c})`).join(" · ")||"–"}</p>
    <p class="hint">${t("briefSource")}</p><p class="hint" id="brief-msg" role="status"></p></article>`;
  BRIEF_TEXT=[t("briefTitle")+" — "+today,t("briefFilters")+": "+(f.length?f.join(" · "):t("briefNone")),"",cols.join("\t"),...top.map(n=>row(n).join("\t")+"\t"+n.u)].join("\n");
  openDlg("brief-dlg");
}
var BRIEF_TEXT="";
(function(){
  $("foryou").onclick=()=>{if(!PROFILE){openProfile();return;}state.forYou=!state.forYou;if(state.forYou){state.sort="match";}buildSort();if(state.forYou){state.sort="match";$("sort").value="match";}activeSaved=null;shown={};render();};
  $("prof-btn").onclick=openProfile;$("prof-close").onclick=()=>closeDlg("prof-dlg");
  $("brief-btn").onclick=openBrief;$("brief-close").onclick=()=>closeDlg("brief-dlg");
  $("brief-copy").onclick=()=>copyText(BRIEF_TEXT,t("briefCopied"));
  $("brief-print").onclick=()=>{document.body.classList.add("printing-brief");let ok=true;try{window.print();}catch(e){ok=false;}setTimeout(()=>document.body.classList.remove("printing-brief"),500);if(!ok)$("brief-msg").textContent=t("briefPrintFail");};
  ["prof-dlg","brief-dlg"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target===$(id))closeDlg(id);}));
  window.addEventListener("afterprint",()=>document.body.classList.remove("printing-brief"));
})();
{const _r2=render;render=function(){_r2();renderForYou();};}
if(PROFILE&&typeof buildSort==="function"){try{buildSort();render();}catch(e){}}
/* ---------- buyer picker: searchable, scrollable list styled like the other menus ---------- */
let BUYERS=[];
function buildBuyers(){
  const m=new Map();
  const add=(name,k)=>{const key=normB(name);if(!key)return;let b=m.get(key);if(!b){b={name,key,opps:0,aw:0,tl:0};m.set(key,b);}b[k]++;};
  const addAll=(x,k)=>{add(x.b,k);(x.jb||[]).forEach(j=>add(j,k));};DATA.notices.forEach(n=>{if(isOpen(n))addAll(n,"opps");});DATA.awards.forEach(a=>addAll(a,"aw"));(DATA.tools||[]).forEach(x=>addAll(x,"tl"));
  BUYERS=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name,"en",{sensitivity:"base"}));
}
function findBuyer(v){const k=normB(v);return k?BUYERS.find(b=>b.key===k):null;}
function syncBuyerInput(){const i=$("buyer-in");if(document.activeElement!==i)i.value=state.buyer||"";$("buyer-prof").hidden=!state.buyer;
  i.placeholder=t("buyerPh");
  const b=state.buyer&&findBuyer(state.buyer);$("buyer-hint").textContent=b?t("buyerCounts",{o:b.opps,a:b.aw,f:b.tl}):t("buyerHint",{n:BUYERS.length});}
(function(){
  const inp=$("buyer-in"),pop=$("buyer-pop"),tog=$("buyer-tog");let hits=[],act=-1;
  const pick=b=>{state.buyer=b?b.name:"";inp.value=state.buyer;close();activeSaved=null;shown={};render();};
  function draw(){
    const cnt=b=>state.tab==="opps"?b.opps:state.tab==="awards"?b.aw:b.tl;
    const allRow=inp.value.trim()&&inp.value!==state.buyer?"":`<li role="option" class="all" data-all="1" aria-selected="false"><span class="tk" aria-hidden="true">${state.buyer?"":"✓"}</span><span class="bn">${esc(t("buyerAll",{n:BUYERS.length}).replace(/\s*\(.*\)$/,""))}</span></li>`;
    pop.innerHTML=allRow+(hits.length?hits.map((b,i)=>`<li role="option" id="bo-${i}" data-i="${i}" aria-selected="${i===act}" title="${esc(b.name+" · "+t("buyerCounts",{o:b.opps,a:b.aw,f:b.tl}))}"><span class="tk" aria-hidden="true">${b.name===state.buyer?"✓":""}</span><span class="bn">${esc(b.name)} (${cnt(b)})</span></li>`).join("")
      :`<li class="none" role="option" aria-disabled="true"><span class="tk"></span><span class="bn">${t("buyerNoMatch")}</span></li>`);
    inp.setAttribute("aria-activedescendant",act>=0?"bo-"+act:"");
    const el=act>=0&&pop.querySelector("#bo-"+act);if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest"});
  }
  function open(all){
    const q=all?"":inp.value.trim().toLowerCase();
    hits=q?BUYERS.filter(b=>b.name.toLowerCase().includes(q)||b.key.includes(normB(q))):BUYERS.slice();
    act=state.buyer?hits.findIndex(b=>b.name===state.buyer):-1;
    pop.hidden=false;inp.setAttribute("aria-expanded","true");draw();
  }
  function close(){pop.hidden=true;inp.setAttribute("aria-expanded","false");inp.removeAttribute("aria-activedescendant");act=-1;}
  inp.addEventListener("input",()=>{open(false);if(!inp.value.trim()){act=-1;draw();}});
  inp.addEventListener("focus",()=>{if(pop.hidden)open(inp.value===state.buyer);});
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(pop.hidden)open(inp.value===state.buyer);if(!hits.length)return;act=e.key==="ArrowDown"?Math.min(hits.length-1,act+1):Math.max(0,act-1);draw();}
    else if(e.key==="Enter"){e.preventDefault();if(!inp.value.trim())pick(null);else if(!pop.hidden&&act>=0)pick(hits[act]);else if(hits.length===1)pick(hits[0]);}
    else if(e.key==="Escape"){if(!pop.hidden){e.preventDefault();close();inp.value=state.buyer||"";}}
  });
  inp.addEventListener("blur",()=>setTimeout(()=>{if(document.activeElement===inp)return;close();if(!inp.value.trim()&&state.buyer)pick(null);else inp.value=state.buyer||"";},150));
  pop.addEventListener("mousedown",e=>e.preventDefault());
  pop.addEventListener("click",e=>{if(e.target.closest("li[data-all]")){pick(null);return;}const li=e.target.closest("li[data-i]");if(li)pick(hits[+li.dataset.i]);});
  tog.addEventListener("mousedown",e=>e.preventDefault());
  tog.addEventListener("click",()=>{if(pop.hidden){inp.focus();open(true);}else close();});
  $("buyer-prof").onclick=()=>{if(state.buyer)openBuyer(state.buyer);};
})();

buildMap();applyLang();buildBuyers();readHash();render();
</script>
